[package]
name = "secureguard-desktop"
version = "0.1.0"
description = "SecureGuard Antivirus desktop shell: wraps secureguard-core directly, in-process, no backend."
edition = "2021"
rust-version = "1.74"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secureguard-core = { path = "../../core" }

[[bin]]
name = "secureguard-desktop"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
