[package]
name = "secureguard-core"
version.workspace = true
edition = "2021"
rust-version = "1.74"
description = "SecureGuard detection engine core: hash matching, YARA-X pattern matching, entropy-based packer detection, weighted scoring."
license = "MIT"

[lib]
name = "secureguard_core"
path = "src/lib.rs"

[[bin]]
name = "scg-scan"
path = "src/bin/scg_scan.rs"

[dependencies]
yara-x = { version = "1.20.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zip = "8.6"
hex = "0.4"
regex = "1"
ureq = "3.4"

[dev-dependencies]
tempfile = "3"

# Phase 5.3 spike (throwaway): candidate network-observation crates, used only
# by examples/net_probe.rs. Promoted to [dependencies] (or dropped) once the
# spike decides.
listeners = "0.6"
netstat2 = "0.11"
if-addrs = "0.15"
