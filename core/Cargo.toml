[package]
name = "secureguard-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "SecureGuard detection engine core: hash matching, YARA-X pattern matching, entropy-based packer detection, weighted scoring."
license = "MIT"

[lib]
name = "secureguard_core"
path = "src/lib.rs"

[[bin]]
name = "scg-scan"
path = "src/bin/scg_scan.rs"

[dependencies]
yara-x = { version = "1.20.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zip = "1.1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
ureq = "2.10"
