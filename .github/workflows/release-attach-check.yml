name: Check attaching files to a draft release

# Run by hand: Actions, "Check attaching files to a draft release", Run workflow.
# It makes a throwaway tag and a DRAFT release for it (the real release's draft
# also has its tag when it is made), prints what GitHub reports about the
# draft, attaches sample files to it with the same script the release uses
# (twice, so replacing a file is tested too), checks that the files are there
# and that it is still a draft, and deletes the draft and the tag. It takes
# about a minute, builds nothing, and shows whether this workflow's token may
# create a draft and attach files to it. Nothing public is ever created. If a
# run is cancelled halfway, delete the draft and the attach-check-* tag by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: attach-check-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Create a throwaway tag
        id: tag
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq '"created " + .ref'
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create a throwaway draft release
        id: draft
        run: |
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Attach check $TAG" \
            -f body="Throwaway draft made by a check workflow. It is deleted at the end." \
            -F draft=true --jq '.id')"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"GitHub reports: id \(.id), tag_name \(.tag_name), draft \(.draft), url \(.html_url)"'

      - name: Attach sample files, twice
        run: |
          mkdir sample
          echo one > sample/checksums.txt
          echo two > sample/checksums.txt.asc
          echo three > sample/scg-scan-test
          bash .github/scripts/attach-release-assets.sh "$TAG" sample/checksums.txt sample/checksums.txt.asc sample/scg-scan-test
          echo "--- again, to replace the same three"
          bash .github/scripts/attach-release-assets.sh "$TAG" sample/checksums.txt sample/checksums.txt.asc sample/scg-scan-test

      - name: Check the files are on the draft and that it is still a draft
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          jq -r '"draft: \(.draft), assets: \([.assets[].name] | join(", "))"' release.json
          jq -e '.draft == true and (.assets | length) == 3' release.json

      - name: Delete the throwaway draft
        if: always() && steps.draft.outputs.id != ''
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"

      - name: Delete the throwaway tag
        if: always() && steps.tag.outputs.created == 'true'
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
