name: Release

# Triggered on version tags (v1.0.0 etc.), not a branch push, matching the
# distribution plan: GitHub Releases only, one tag = one release. Uses the
# official tauri-apps/tauri-action for the desktop bundle rather than
# hand-rolling platform-specific bundle invocations, see
# docs/phase5-release-workflow-plan.md's "Build strategy" section for why.
#
# NOTE ON VERIFICATION: this workflow has never actually run. Its real test
# gate, per the plan doc, is a live tag push, not more code or more tests.
# Expect the first real run to surface something this file didn't
# anticipate, especially around matrix artifact-passing between the build
# and sign jobs, a common source of GitHub Actions bugs independent of
# anything Tauri- or Rust-specific.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-version-matches-tag:
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify the pushed tag matches [workspace.package].version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # awk, not a naive `grep -A1`: the previous version silently
          # grabbed whatever line happened to sit one line below
          # "[workspace.package]", which broke the moment a comment was
          # added there (the comment's own text contained the word
          # "version", so `grep version` matched the comment instead of
          # the real `version = "..."` line below it). This scans the
          # section explicitly for a line that actually starts with
          # `version =`, ignoring comment lines, and stops at the next
          # `[section]` header if reached first.
          CARGO_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            in_section && /^\[/ { exit }
            in_section && /^version[[:space:]]*=/ { print; exit }
          ' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo workspace version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match [workspace.package].version ($CARGO_VERSION). Fix Cargo.toml or the tag before releasing."
            exit 1
          fi

      - name: Extract CHANGELOG.md section for this version
        id: notes
        run: |
          # Same pattern as the main Antivirus repo's release.yml: match the
          # "## [VERSION]" heading (tag with its leading "v" stripped) up to
          # the next "## [" heading, fail loudly if nothing matches rather
          # than shipping a release with an empty or stale body. Before
          # tagging a real release, the "## [Unreleased]" section in
          # CHANGELOG.md must be renamed to "## [VERSION] - DATE" first.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
              BEGIN { found = 0 }
              $0 ~ "^## \\[" version "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
          ' CHANGELOG.md > changelog-section.md

          if [ ! -s changelog-section.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION. Add a \"## [$VERSION]\" heading before tagging."
            exit 1
          fi

          {
            echo "See \`checksums.txt\` and \`checksums.txt.asc\` (attached once all"
            echo "platform builds complete) to verify your download. **GitHub is the"
            echo "only official distribution source for SecureGuard**, do not trust"
            echo "installers found anywhere else."
            echo
            cat changelog-section.md
          } > release-notes.md

          # Multi-line job output: the documented GitHub Actions delimiter
          # pattern, a plain `echo "body=...".` only handles single-line
          # values.
          echo "body<<RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          echo "RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"

  # A bad signing secret used to show up only in the last job, after the
  # builds. This fails in about a minute instead. The same two scripts sign
  # the checksums below, so a pass here means that step will work.
  check-signing-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Import the GPG signing key and check that it can sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash .github/scripts/import-gpg-key.sh

  build-desktop:
    needs: [check-version-matches-tag, check-signing-key]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # macOS is removed from the release for now. Bringing it back needs
        # Apple signing and notarization, a safe place for the helper, and a
        # Mac to test on; see docs/phase5-helper-release-design.md.
        include:
          - platform: 'windows-latest'
            target-triple: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target-triple: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target-triple }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target-triple }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install desktop app npm dependencies
        working-directory: desktop
        run: npm install

      # The helper goes INSIDE the installers, as a Tauri sidecar, so it must
      # exist before tauri-action runs. The sidecar is named with the target
      # triple, which is how Tauri finds it. The base tauri.conf.json does not
      # list it (a missing file would fail every ordinary build); the overlay
      # config passed below does.
      - name: Build the privileged helper and place it for the installer
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          cargo build --release --package secureguard-helper --target ${{ matrix.target-triple }}
          mkdir -p desktop/src-tauri/binaries
          cp "target/${{ matrix.target-triple }}/release/secureguard-helper$EXT" \
             "desktop/src-tauri/binaries/secureguard-helper-${{ matrix.target-triple }}$EXT"

      - name: Build and release the desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'SecureGuard ${{ github.ref_name }}'
          releaseBody: ${{ needs.check-version-matches-tag.outputs.release_notes }}
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.target-triple }} --config src-tauri/tauri.release.conf.json'

      - name: Build the scg-scan CLI binary
        run: cargo build --release --package secureguard-core --bin scg-scan --target ${{ matrix.target-triple }}

      # tauri-action attaches the installers to the draft release itself, but
      # the checksum job cannot see them there. Copy the same files, plus the
      # CLI under a per-target name, into one folder and hand it on as a
      # workflow artifact. Nothing else is collected, so the checksums cover
      # exactly what is attached to the release.
      - name: Collect the release files
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target-triple }}"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          if [ ! -d "target/$T/release/bundle" ]; then
            echo "::error::The bundle folder target/$T/release/bundle does not exist"
            exit 1
          fi
          mkdir -p release-assets
          find "target/$T/release/bundle" -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} release-assets/ \;
          if [ -z "$(find release-assets -maxdepth 1 -type f)" ]; then
            echo "::error::No installers found under target/$T/release/bundle"
            exit 1
          fi
          cp "target/$T/release/scg-scan$EXT" "release-assets/scg-scan-$T$EXT"
          ls -l release-assets

      - name: Upload the release files as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target-triple }}
          path: release-assets/*
          if-no-files-found: error

  checksum-and-sign:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the release files from every platform
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      # Checksums are listed by bare file name so `sha256sum -c
      # --ignore-missing checksums.txt` works in a downloads folder.
      - name: Compute SHA-256 checksums
        run: |
          bash .github/scripts/make-checksums.sh release-assets checksums.txt
          cat checksums.txt

      # The secrets go in through the environment, not into the script text.
      - name: Import the GPG signing key and check that it can sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash .github/scripts/import-gpg-key.sh

      - name: Sign the checksums file
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash .github/scripts/sign-checksums.sh checksums.txt

      # The installers are already on the draft release (tauri-action attached
      # them). This adds the CLI binaries, the checksums and the signature
      # with upload calls only: the script never edits the release, so it
      # cannot publish it, and it refuses a release that is not a draft.
      # (softprops/action-gh-release was used here, but its update call on
      # the draft was refused with "Resource not accessible by integration".)
      - name: Attach the CLI binaries, checksums and signature to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/attach-release-assets.sh "$TAG" checksums.txt checksums.txt.asc release-assets/scg-scan-*
