name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        # Tauri's Linux backend (wry/tao) links against real GTK/WebKit
        # system libraries via pkg-config, unlike Windows (WebView2) or
        # macOS (WKWebView), where the OS-provided webview needs nothing
        # extra installed. This step didn't exist before Phase 3 added
        # desktop/src-tauri to the workspace, --workspace builds now pull
        # this crate in and fail on a bare ubuntu-latest runner without it.
        # See https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  msrv:
    # Guards the rust-version declared in core, helper and desktop. The floor is
    # set by the YARA-X and wasmtime versions in Cargo.lock (both 1.93), so a
    # dependency bump that raises it fails here, on the pinned toolchain, instead
    # of surfacing on someone's older compiler. --locked makes this check the
    # exact dependency versions that are committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        # Same list as build-and-test: --workspace includes the desktop crate.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.120

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check on the minimum supported Rust version
        run: cargo check --workspace --locked

  windows:
    # The helper's named-pipe access control is cfg(windows) code that the Linux jobs
    # never compile. This job builds it, lints it, and runs the helper's socket tests,
    # which create the real pipe with the security descriptor.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (core and helper)
        run: cargo clippy --locked -p secureguard-core -p secureguard-helper -- -D warnings

      - name: Test (core and helper)
        run: cargo test --locked -p secureguard-core -p secureguard-helper
