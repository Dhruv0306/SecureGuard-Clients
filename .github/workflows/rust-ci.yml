name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        # Tauri's Linux backend (wry/tao) links against real GTK/WebKit
        # system libraries via pkg-config, unlike Windows (WebView2) or
        # macOS (WKWebView), where the OS-provided webview needs nothing
        # extra installed. This step didn't exist before Phase 3 added
        # desktop/src-tauri to the workspace, --workspace builds now pull
        # this crate in and fail on a bare ubuntu-latest runner without it.
        # See https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
