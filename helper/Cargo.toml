[package]
name = "secureguard-helper"
version.workspace = true
description = "SecureGuard privileged helper: the only process that writes the hosts file. See docs/phase4-desktop-privileged-helper-plan.md."
edition = "2021"
rust-version = "1.93"

[[bin]]
name = "secureguard-helper"
path = "src/main.rs"

[lib]
name = "secureguard_helper"
path = "src/lib.rs"

[dependencies]
secureguard-core = { path = "../core" }
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Builds the Windows named-pipe security descriptor from its string form. Already
# in the dependency tree through interprocess; named here because it appears in
# interprocess's public API (U16CStr).
[target.'cfg(windows)'.dependencies]
widestring = "1"

[dev-dependencies]
tempfile = "3"
